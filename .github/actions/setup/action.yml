name: Set up data agents
description: Install Python and the pinned dependencies, and trim stray whitespace from secrets.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt
    - run: pip install -r requirements.txt
      shell: bash
    # A secret pasted with a trailing line break breaks HTTP headers. Trim every one the agents read.
    - name: Trim whitespace from secrets
      shell: bash
      run: |
        for name in SUPABASE_URL SUPABASE_SERVICE_KEY OPENSTATES_API_KEY CONGRESS_API_KEY FEC_API_KEY; do
          raw="${!name-}"
          [ -z "$raw" ] && continue
          clean="$(printf '%s' "$raw" | tr -d '\r\n\t ')"
          echo "::add-mask::$clean"
          echo "$name=$clean" >> "$GITHUB_ENV"
        done
