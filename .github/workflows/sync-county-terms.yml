name: Sync county terms

# Fills county officials' party and term dates from certified Secretary of State results, and adds their
# elected terms to the office history. Run after Sync official results.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without saving"
        type: boolean
        default: true

concurrency:
  group: sync-county-terms
  cancel-in-progress: false

jobs:
  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Derive county terms
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python agents/county-terms-sync.py $ARGS
