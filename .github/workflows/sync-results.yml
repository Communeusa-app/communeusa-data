name: Sync official results

# Candidates and vote counts from the WA Secretary of State results export.
# Runs every evening (Pacific) while ballots are still being counted, and can be run by hand.
# Scheduled runs write unofficial counts. Mark results certified by hand with the "certified"
# box once the state certifies. The schedule stops on its own after the end date below.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Election date as YYYYMMDD (general election: 20261103). Several dates can be separated by commas, for example 20220802,20221108"
        required: true
        default: "20261103"
      discover:
        description: "Only list the results pages and files the state site offers (writes nothing)"
        type: boolean
        default: false
      file_url:
        description: "Optional: full address of a results CSV, if the default address is not found"
        required: false
        default: ""
      dry_run:
        description: "Print what would change without writing"
        type: boolean
        default: true
      certified:
        description: "Mark results as certified (only after the state certifies)"
        type: boolean
        default: false
      certify_recent:
        description: "Allow certifying an election less than 30 days old (only if the state has certified)"
        type: boolean
        default: false

concurrency:
  group: sync-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Inspect
        run: python agents/sos-results-sync.py --date 20261103 --inspect 'Alvarez|Baldwin|Letham|Brunson|Jeff Gadman'
      - name: Official results
        env:
          # Scheduled runs have no inputs, so these defaults apply: general election, real write.
          ELECTION_DATE: ${{ inputs.date || '20261103' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          CERTIFIED: ${{ inputs.certified || 'false' }}
          CERTIFY_RECENT: ${{ inputs.certify_recent || 'false' }}
          DISCOVER: ${{ inputs.discover || 'false' }}
          FILE_URL: ${{ inputs.file_url || '' }}
        run: |
          # Scheduled runs stop after 2026-12-31 (certification is done by then).
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d)" -gt 20261231 ]; then
            echo "Past the end date for scheduled runs, nothing to do."
            exit 0
          fi
          for d in ${ELECTION_DATE//,/ }; do
            echo "=== Election $d ==="
            args=(--date "$d")
            if [ "$DISCOVER" = "true" ]; then args+=(--discover); fi
            if [ -n "$FILE_URL" ]; then args+=(--file "$FILE_URL"); fi
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            if [ "$CERTIFIED" = "true" ]; then args+=(--certified); fi
            if [ "$CERTIFY_RECENT" = "true" ]; then args+=(--certify-recent); fi
            python agents/sos-results-sync.py "${args[@]}"
          done
