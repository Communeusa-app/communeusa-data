name: Sync official results

# Candidates and vote counts from the WA Secretary of State results export.
# Manual for now: run it after election night and again after certification.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Election date as YYYYMMDD (general election: 20261103)"
        required: true
        default: "20261103"
      discover:
        description: "Only list the results pages and files the state site offers (writes nothing)"
        type: boolean
        default: false
      file_url:
        description: "Optional: full address of a results CSV, if the default address is not found"
        required: false
        default: ""
      dry_run:
        description: "Print what would change without writing"
        type: boolean
        default: true
      certified:
        description: "Mark results as certified (only after the state certifies)"
        type: boolean
        default: false

concurrency:
  group: sync-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Official results
        env:
          ELECTION_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          CERTIFIED: ${{ inputs.certified }}
          DISCOVER: ${{ inputs.discover }}
          FILE_URL: ${{ inputs.file_url }}
        run: |
          args=(--date "$ELECTION_DATE")
          if [ "$DISCOVER" = "true" ]; then args+=(--discover); fi
          if [ -n "$FILE_URL" ]; then args+=(--file "$FILE_URL"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$CERTIFIED" = "true" ]; then args+=(--certified); fi
          python agents/sos-results-sync.py "${args[@]}"
