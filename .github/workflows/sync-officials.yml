name: Sync officials

# Federal and state legislators (Congress.gov, Open States), county officials, and the nine statewide offices.
on:
  schedule:
    - cron: "17 10 * * 1"   # Mondays 10:17 UTC
  workflow_dispatch:

concurrency:
  group: sync-officials
  cancel-in-progress: false

jobs:
  officials:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Legislators (Open States, Congress.gov)
        run: python agents/data-sync.py
      - name: County officials
        run: python agents/county-sync.py
      - name: Statewide officials
        run: python agents/statewide-sync.py
